[workspace]
members = [
  "crates/proto",
  "crates/identity",
  "crates/transport",
  "crates/relay",
  "crates/agent",
  "crates/client",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
assert_cmd = "2.0"
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive", "cargo"] }
directories = "5.0"
postcard = { version = "1.0", features = ["alloc"] }
proptest = "1.0"
quinn = "0.11"
rand = "0.8"
rcgen = "0.13"
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.39", features = ["full"] }
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
zeroize = "1.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
