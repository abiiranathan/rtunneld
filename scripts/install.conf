# Defaults loaded by scripts/install.sh.
#
# Every value can be overridden from the environment, and environment values
# take precedence over the defaults below. Edit this file only if you want a
# checkout to use different defaults.

: "${RTUNNEL_REPO:=abiiranathan/rtunneld}"
: "${RTUNNEL_VERSION:=latest}"
: "${RTUNNEL_TARGET:=}"
: "${RTUNNEL_DOWNLOAD_BASE:=}"

: "${RTUNNEL_RELAY_STATE_DIR:=/var/lib/rtunnel}"
: "${RTUNNEL_AGENT_STATE_DIR:=/var/lib/rtunnel-agent}"
: "${RTUNNEL_LISTEN_ADDR:=0.0.0.0:4433}"

# Optional overrides.
: "${RTUNNEL_BIN:=}"
: "${RTUNNEL_BIN_DIR:=}"
