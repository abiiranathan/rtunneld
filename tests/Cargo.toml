[package]
name = "rtunnel-integration-tests"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
assert_cmd = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
quinn = { workspace = true }
rustls = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
tempfile = { workspace = true }
rtunnel-proto = { path = "../crates/proto" }
rtunnel-identity = { path = "../crates/identity" }
rtunnel-transport = { path = "../crates/transport" }
rtunnel-relay = { path = "../crates/relay" }
rtunnel-agent = { path = "../crates/agent" }
rtunnel-client = { path = "../crates/client" }

[dev-dependencies]
serde_json = "1"

[[test]]
name = "integration_test"
path = "integration_test.rs"
